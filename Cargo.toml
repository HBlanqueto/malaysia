# Workspace root: shared settings and build profiles for the crates.
[workspace]
resolver = "3"
members = [
    "crates/malaysia-compositor",
    "crates/malaysia-scene",
    "crates/grade-graphics",
    "crates/malaysia-shell",
    "crates/malaysia-wallpaper",
    "crates/malaysia-settings",
    "crates/malaysia-services",
    "crates/xdg-desktop-portal-malaysia",
    "tools/sctk-probe",
]

default-members = [
    "crates/malaysia-compositor",
    "crates/malaysia-scene",
    "crates/grade-graphics",
    "crates/malaysia-shell",
    "crates/malaysia-wallpaper",
    "crates/malaysia-settings",
    "crates/malaysia-services",
    "crates/xdg-desktop-portal-malaysia",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/HBlanqueto/malaysia"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = "0.3"

libc = "0.2"
zeroize = "1"

calloop = { version = "0.14", features = ["signals"] }
nix = { version = "0.31", features = ["signal", "socket", "poll", "fs", "user"] }

xcursor = "0.3"

serde = { version = "1", features = ["derive"] }
toml = "0.8"

xkbcommon = "0.9"

zbus = "5"

chrono = "0.4"

grade-graphics = { path = "crates/grade-graphics" }
malaysia-scene = { path = "crates/malaysia-scene" }
malaysia-services = { path = "crates/malaysia-services" }

bk = { git = "https://github.com/HBlanqueto/barrierkit", rev = "5e8f892115db3239fd849fc5327ba4cce2dc42a6" }
ctdesign = { git = "https://github.com/HBlanqueto/barrierkit", rev = "5e8f892115db3239fd849fc5327ba4cce2dc42a6" }
ctappearance = { git = "https://github.com/HBlanqueto/barrierkit", rev = "5e8f892115db3239fd849fc5327ba4cce2dc42a6" }
infinity-protocol = { git = "https://github.com/HBlanqueto/barrierkit", rev = "5e8f892115db3239fd849fc5327ba4cce2dc42a6" }

freya-animation = "=0.5.0"
freya-core = "=0.5.0"
freya-clipboard = "=0.5.0"
freya-components = { version = "=0.5.0", default-features = false }
freya-engine = "=0.5.0"
freya-testing = "=0.5.0"
async-io = "2"
async-channel = "2"
futures-lite = "2"
torin = "=0.5.0"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

wayland-client = { version = "0.31", features = ["system"] }
wayland-scanner = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3.12", default-features = false }


cosmic-text = "0.19"

unicode-segmentation = "1"

png = "0.17"
plist = "1"
base64 = "0.23"
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-app = { version = "0.25", features = ["v1_24"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
zune-jpeg = "0.5"
half = { version = "2", features = ["bytemuck"] }

sctk = { package = "smithay-client-toolkit", version = "0.20" }

wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "wgsl", "glsl"] }
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }

smithay = { git = "https://github.com/Smithay/smithay", rev = "65aa86fa5236e41775c313408102a5d5c2d1e2ca", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "renderer_multi",
] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 0
debug = false

[profile.dev.package.smithay]
opt-level = 2

[profile.dev.package.cosmic-text]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.malaysia-wallpaper]
opt-level = 2

[profile.dev.package.ctdesign]
opt-level = 2

[profile.dev.package.freya-core]
opt-level = 2

[profile.dev.package.freya-components]
opt-level = 2

[profile.dev.package.freya-edit]
opt-level = 2

[profile.dev.package.freya-animation]
opt-level = 2

[profile.dev.package.freya-engine]
opt-level = 2

[profile.dev.package.freya-clipboard]
opt-level = 2

[profile.dev.package.freya-skia-safe]
opt-level = 2

[profile.dev.package.torin]
opt-level = 2

[profile.dev.package.ragnarok]
opt-level = 2

[profile.dev.package.spellbook]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.crc32fast]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
