[workspace]
resolver = "3"
members = ["crates/malaysia-compositor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
smithay = { git = "https://github.com/Smithay/smithay", rev = "65aa86fa5236e41775c313408102a5d5c2d1e2ca", default-features = false, features = ["backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "desktop", "renderer_gl", "wayland_frontend"] }
ctdesign = { git = "https://github.com/HBlanqueto/barrierkit", rev = "9317e34de6bb1a7a013a08ddb9bc0d56317e6e32", default-features = false }
limitless = { git = "https://github.com/HBlanqueto/barrierkit", rev = "9317e34de6bb1a7a013a08ddb9bc0d56317e6e32", default-features = false, features = ["client", "server"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
calloop = { version = "0.14.5", default-features = false, features = ["signals"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
