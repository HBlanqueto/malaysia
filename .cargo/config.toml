# Cargo configuration for the Neptune workspace.
#
# The mold linker is requested by the devShell, which both installs mold and
# sets RUSTFLAGS="-C link-arg=-fuse-ld=mold" (see flake.nix). It is
# deliberately not committed here: .cargo/config.toml applies to every
# invocation, including `nix build` of the package, where mold is absent.
#
# The equivalent manual invocation outside the shell is:
#
#   RUSTFLAGS="-C link-arg=-fuse-ld=mold" cargo build

[net]
git-fetch-with-cli = true
