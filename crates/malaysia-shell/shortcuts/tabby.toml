ids = ["tabby"]
sources = [
  "https://raw.githubusercontent.com/Eugeny/tabby/master/tabby-core/src/configDefaults.linux.yaml",
  "https://raw.githubusercontent.com/Eugeny/tabby/master/tabby-terminal/src/config.ts",
  "https://raw.githubusercontent.com/Eugeny/tabby/master/tabby-local/src/config.ts",
  "https://raw.githubusercontent.com/Eugeny/tabby/master/tabby-electron/src/config.ts",
  "https://raw.githubusercontent.com/Eugeny/tabby/master/tabby-settings/src/config.ts",
  "https://raw.githubusercontent.com/Eugeny/tabby/master/electron-builder.yml",
  "https://raw.githubusercontent.com/Eugeny/tabby/master/app/lib/app.ts",
]

[[menus]]
label = "file"
items = [
  ["new-window", "Ctrl+Shift+N"],
  ["new-tab", "Ctrl+Shift+T"],
  [],
  ["close-tab", "Ctrl+Shift+W"],
  ["reopen-tab", "Ctrl+Shift+Z"],
  [],
  ["settings", "Ctrl+comma"],
]

[[menus]]
label = "edit"
items = [
  ["copy", "Ctrl+Shift+C"],
  ["paste", "Ctrl+Shift+V"],
  ["select-all", "Ctrl+Shift+A"],
  [],
  ["find", "Ctrl+Shift+F"],
]

[[menus]]
label = "view"
items = [
  ["command-palette", "Ctrl+Shift+P"],
  [],
  ["zoom-in", "Ctrl+equal"],
  ["zoom-out", "Ctrl+minus"],
  ["zoom-reset", "Ctrl+0"],
]

[[menus]]
label = "terminal"
items = [
  ["split-right", "Ctrl+Shift+S"],
  ["split-down", "Ctrl+Shift+D"],
]

[[menus]]
label = "tab"
items = [
  ["next-tab", "Ctrl+Tab"],
  ["previous-tab", "Ctrl+Shift+Tab"],
]
