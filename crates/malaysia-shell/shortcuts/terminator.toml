[[menus]]
label = "file"
items = [
  ["new-window", "Ctrl+Shift+I"],
  ["new-tab", "Ctrl+Shift+T"],
]

[[menus]]
label = "edit"
items = [
  ["copy", "Ctrl+Shift+C"],
  ["paste", "Ctrl+Shift+V"],
  [],
  ["find", "Ctrl+Shift+F"],
]

