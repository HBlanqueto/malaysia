[[menus]]
label = "file"
items = [
  ["save", "Ctrl+S"],
  [],
  ["print", "Ctrl+P"],
]

[[menus]]
label = "edit"
items = [
  ["undo", "Ctrl+Z"],
  ["redo", "Ctrl+Y"],
  [],
  ["cut", "Ctrl+X"],
  ["copy", "Ctrl+C"],
  ["paste", "Ctrl+V"],
  [],
  ["find", "Ctrl+F"],
  ["replace", "Ctrl+H"],
]

[[menus]]
label = "insert"
items = [
  ["new-slide", "Ctrl+Return"],
  [],
  ["insert-link", "Ctrl+K"],
]

[[menus]]
label = "format"
items = [
  ["bold", "Ctrl+B"],
  ["italic", "Ctrl+I"],
  ["underline", "Ctrl+U"],
  [],
  ["superscript", "Ctrl+Shift+equal"],
  ["subscript", "Ctrl+equal"],
  [],
  ["increase-font-size", "Ctrl+bracketright"],
  ["decrease-font-size", "Ctrl+bracketleft"],
  [],
  ["align-left", "Ctrl+L"],
  ["align-center", "Ctrl+E"],
  ["align-right", "Ctrl+R"],
  ["justify", "Ctrl+J"],
  [],
  ["group", "Ctrl+G"],
  ["ungroup", "Ctrl+Shift+G"],
]

[[menus]]
label = "slide"
items = [
  ["start-slideshow", "F5"],
  ["start-slideshow-current", "Shift+F5"],
]

[[menus]]
label = "tools"
items = [
  ["vb-editor", "Alt+F11"],
]
