ids = ["com.mitchellh.ghostty", "ghostty"]
sources = [
  "https://raw.githubusercontent.com/ghostty-org/ghostty/main/src/config/Config.zig",
  "https://raw.githubusercontent.com/ghostty-org/ghostty/main/dist/linux/app.desktop.in",
  "https://raw.githubusercontent.com/ghostty-org/ghostty/main/src/build/GhosttyResources.zig",
]

[[menus]]
label = "file"
items = [
  ["new-window", "Ctrl+Shift+N"],
  ["new-tab", "Ctrl+Shift+T"],
  [],
  ["close-tab", "Ctrl+Shift+W"],
]

[[menus]]
label = "edit"
items = [
  ["copy", "Ctrl+Shift+C"],
  ["paste", "Ctrl+Shift+V"],
  ["select-all", "Ctrl+Shift+A"],
  [],
  ["find", "Ctrl+Shift+F"],
]

[[menus]]
label = "view"
items = [
  ["zoom-in", "Ctrl+equal"],
  ["zoom-out", "Ctrl+minus"],
  ["zoom-reset", "Ctrl+0"],
]

[[menus]]
label = "tab"
items = [
  ["next-tab", "Ctrl+Tab"],
  ["previous-tab", "Ctrl+Shift+Tab"],
]
