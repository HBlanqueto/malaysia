ids = ["org.godotengine.Editor", "Godot_Editor", "Godot"]
sources = [
  "https://docs.godotengine.org/en/4.6/tutorials/editor/default_key_mapping.html",
  "https://raw.githubusercontent.com/godotengine/godot-docs/4.6/tutorials/editor/default_key_mapping.rst",
  "https://raw.githubusercontent.com/godotengine/godot/master/misc/dist/linux/org.godotengine.Godot.desktop",
  "https://raw.githubusercontent.com/godotengine/godot/master/platform/linuxbsd/wayland/display_server_wayland.cpp",
  "https://raw.githubusercontent.com/godotengine/godot/master/platform/linuxbsd/x11/display_server_x11.cpp",
  "https://docs.godotengine.org/en/4.6/classes/class_nativemenu.html",
]

