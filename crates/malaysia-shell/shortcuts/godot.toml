  ["open", "Ctrl+O"],
  ["quick-open", "Shift+Alt+O"],
  ["quick-open-scene", "Ctrl+Shift+O"],
  ["quick-open-script", "Ctrl+Alt+O"],
  [],
  ["save", "Ctrl+S"],
  ["save-as", "Ctrl+Shift+S"],
  ["save-all", "Ctrl+Shift+Alt+S"],
  [],
  ["close-document", "Ctrl+Shift+W"],
  ["reopen-tab", "Ctrl+Shift+T"],
  [],
  ["next-tab", "Ctrl+Tab"],
  ["previous-tab", "Ctrl+Shift+Tab"],
]

[[menus]]
label = "edit"
items = [
  ["undo", "Ctrl+Z"],
  ["redo", "Ctrl+Shift+Z"],
  [],
  ["cut", "Ctrl+X"],
  ["copy", "Ctrl+C"],
  ["paste", "Ctrl+V"],
  ["select-all", "Ctrl+A"],
  [],
  ["toggle-comment", "Ctrl+K"],
  ["delete-line", "Ctrl+Shift+K"],
  ["move-line-up", "Alt+Up"],
