ids = ["hyper"]
sources = [
  "https://raw.githubusercontent.com/vercel/hyper/canary/app/keymaps/linux.json",
  "https://raw.githubusercontent.com/vercel/hyper/canary/app/package.json",
  "https://raw.githubusercontent.com/vercel/hyper/canary/electron-builder.json",
  "https://raw.githubusercontent.com/vercel/hyper/canary/app/menus/menu.ts",
  "https://raw.githubusercontent.com/vercel/hyper/canary/app/index.ts",
  "https://raw.githubusercontent.com/vercel/hyper/canary/app/ui/window.ts",
]

[[menus]]
label = "file"
items = [
  ["new-window", "Ctrl+Shift+N"],
  ["new-tab", "Ctrl+Shift+T"],
  [],
  ["settings", "Ctrl+comma"],
]

[[menus]]
label = "edit"
items = [
  ["undo", "Ctrl+Shift+Z"],
  ["redo", "Ctrl+Shift+Y"],
  [],
  ["cut", "Ctrl+Shift+X"],
  ["copy", "Ctrl+Shift+C"],
  ["paste", "Ctrl+Shift+V"],
  ["select-all", "Ctrl+Shift+A"],
  [],
  ["find", "Ctrl+Shift+F"],
]

[[menus]]
label = "view"
items = [
  ["reload", "Ctrl+Shift+R"],
  [],
  ["zoom-in", "Ctrl+equal"],
  ["zoom-out", "Ctrl+minus"],
  ["zoom-reset", "Ctrl+0"],
]

[[menus]]
label = "terminal"
items = [
  ["split-right", "Ctrl+Shift+D"],
  ["split-down", "Ctrl+Shift+E"],
  [],
  ["close-pane", "Ctrl+Shift+W"],
]

[[menus]]
label = "tab"
items = [
  ["next-tab", "Ctrl+Tab"],
  ["previous-tab", "Ctrl+Shift+Tab"],
]
