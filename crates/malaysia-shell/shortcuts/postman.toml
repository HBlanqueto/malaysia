label = "view"
items = [
  ["search", "Ctrl+K"],
  ["search-workspace", "Ctrl+Shift+F"],
  ["search-tabs", "Ctrl+Shift+A"],
  ["command-palette", "Ctrl+Shift+P"],
  [],
  ["open-console", "Ctrl+Alt+C"],
]
