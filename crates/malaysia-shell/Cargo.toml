[package]
name = "malaysia-shell"
description = "The Malaysia shell: one binary, one process per component (ADR 0023)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "malaysia-shell"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono.workspace = true
serde.workspace = true
toml.workspace = true
bk = { workspace = true, features = ["shell"] }
freya-animation.workspace = true
freya-core.workspace = true
freya-components.workspace = true
torin.workspace = true
async-io.workspace = true
async-channel.workspace = true
futures-lite.workspace = true
ctappearance.workspace = true
ctdesign.workspace = true
libc.workspace = true
zeroize.workspace = true
zbus.workspace = true
png.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true
[dev-dependencies]
freya-engine.workspace = true

# bk::localize! and bk::tr! expand to these crates in this crate.
[package.metadata.cargo-shear]
ignored = ["i18n-embed", "i18n-embed-fl"]

[package.metadata.cargo-machete]
ignored = ["i18n-embed", "i18n-embed-fl"]
