[package]
name = "malaysia-wallpaper"
description = "Malaysia desktop wallpaper drawn with wgpu on Vulkan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "malaysia-wallpaper"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
calloop = { workspace = true }
calloop-wayland-source = "0.4"
futures-lite.workspace = true
png.workspace = true
zune-jpeg.workspace = true
libheif-rs.workspace = true
half.workspace = true
ctappearance.workspace = true
ctdesign.workspace = true
infinity-protocol = { workspace = true, features = ["client"] }
chrono.workspace = true
plist.workspace = true
base64.workspace = true
serde.workspace = true
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-video.workspace = true

wayland-client.workspace = true
wayland-protocols.workspace = true
sctk = { workspace = true }

wgpu.workspace = true
raw-window-handle.workspace = true
bytemuck.workspace = true

# The "system" feature gives the raw libwayland pointers that wgpu needs (wayland.rs).
[package.metadata.cargo-shear]
ignored = ["wayland-client"]

[package.metadata.cargo-machete]
ignored = ["wayland-client"]
