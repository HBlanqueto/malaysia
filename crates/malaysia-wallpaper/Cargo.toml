[package]
name = "malaysia-wallpaper"
description = "MalaysiaDreams desktop wallpaper drawn with wgpu on Vulkan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "malaysia-wallpaper"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
calloop = { workspace = true }
calloop-wayland-source = "0.4"
futures-lite.workspace = true
serde.workspace = true
toml.workspace = true
png.workspace = true
zune-jpeg.workspace = true
vow-appearance.workspace = true
vow-design.workspace = true

# Wayland client stack.
wayland-client = { workspace = true, features = ["system"] }
wayland-protocols = { workspace = true, features = ["client", "staging"] }
wayland-protocols-wlr = { workspace = true, default-features = false }
sctk = { workspace = true }

# Vulkan rendering.
wgpu.workspace = true
raw-window-handle.workspace = true
bytemuck.workspace = true

[dev-dependencies]
png.workspace = true
