# Allowed licenses for `cargo deny check licenses`.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

exceptions = [
]

[licenses.private]
ignore = false

# The two git dependencies, pinned by rev in Cargo.toml.
[sources]
allow-git = [
    "https://github.com/HBlanqueto/barrierkit",
    "https://github.com/Smithay/smithay",
]
